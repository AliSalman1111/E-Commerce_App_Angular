<section class="p-16 bg bg-gray-100">
    <div class="container">

      <h2 class="text-2xl text-green-600 font-medium">Shop Popular Products </h2>
        <div class="parent mt-7 grid gap-3 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 ">

          @for (product of productlist().slice(0,10);track product.id ){
           <app-card [cardProduct]="product" ></app-card>
          }

        </div>
    </div>
</section>
