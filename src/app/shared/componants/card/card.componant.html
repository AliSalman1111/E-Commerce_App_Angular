   <div class="card overflow-hidden flex flex-col h-full ">
                <img [src]="cardProduct.imageCover" [alt]="cardProduct.title">
               <h3 class="text-sm text-green-600">{{cardProduct.category.name}}</h3>
               <h4 class="pb-2">{{cardProduct.title}}</h4>
               <div class="flex flex-wrap text-center justify-between">
                <span>{{cardProduct.price}}</span>

                <span> 
                    <i class="fas fa-star text-yellow-500"></i>
                    {{cardProduct.ratingsAverage}}   
                </span>
               </div>
               <button class="btn-main w-full mt-auto">Add to Cart </button>
            </div>
